name: CI

# Plataforma declarada: Linux/WSL2 unicamente (ver kit/docs). No se anade una
# matriz de macOS "por si acaso": no hay una mac disponible para reproducir
# fallos, asi que no se promete lo que esta CI no prueba.
#
# IMPORTANTE: el eval set (kit/evals/) NUNCA se ejecuta aqui. Cuesta dinero
# real (6 llamadas a `claude -p` contra la API de Anthropic por corrida). Es
# opt-in, solo a mano: `bash kit/evals/run.sh` o `make evals-paid`. Si vas a
# anadir un job nuevo a este workflow, no lo invoques ni directa ni
# indirectamente (nada de `make test` recursivo hacia evals, nada de correr
# run.sh "de paso").

on:
  push:
    branches: [main, v2-autonomous]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a una PR cancela la corrida anterior: ese verde ya no lo mira
# nadie. En main NO se cancela -- cada commit de main deja su propio resultado,
# que es el historico que consulta la proteccion de rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  shellcheck:
    name: shellcheck (kit/*.sh, hooks, tests, scripts de CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck -x (todo .sh versionado, sin lista literal)
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y shellcheck
          # La lista literal que habia aqui dejaba fuera los .sh de la capa de harness
          # (.claude/hooks, scripts/, kit/evals): un script nuevo entraba en el repo sin
          # analizar y sin que nadie se enterara. git ls-files acota a lo VERSIONADO (ni
          # .git ni ficheros sueltos del runner); el hook de git se nombra aparte porque
          # no lleva extension .sh.
          mapfile -t scripts < <(git ls-files -- '*.sh' kit/claude/hooks/git/pre-commit)
          echo "shellcheck -x sobre ${#scripts[@]} ficheros versionados"
          shellcheck -x -- "${scripts[@]}"

  test-suites:
    name: Suites de test (kit/test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: compileall de los .py versionados (un SyntaxError en un hook lo apaga, no lo rompe)
        run: |
          set -euo pipefail
          # Los hooks .py del kit los invoca Claude Code por su cuenta, y un SyntaxError
          # sale con codigo 1: en el contrato de hooks el 1 NO bloquea nada, asi que el
          # hook se convierte en un no-op silencioso en vez de fallar a la vista. Ningun
          # otro paso de esta CI compila estos ficheros.
          # El bytecode va a $RUNNER_TEMP: un __pycache__ dentro del arbol lo escanearian
          # como ficheros del repo los pasos de secretos de este mismo job.
          mapfile -t pyfiles < <(git ls-files -- '*.py')
          echo "compileall sobre ${#pyfiles[@]} ficheros .py versionados"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m compileall -q "${pyfiles[@]}"

      - name: El pin de gitleaks de este workflow y el de kit/install.sh coinciden
        run: |
          set -euo pipefail
          # La version y el hash estan escritos dos veces, en dos rutas de instalacion
          # distintas (ver CONTRIBUTING.md, "Actualizar gitleaks"). Subir una y olvidar la
          # otra no rompia nada visible: CI seguia probando la version vieja en verde.
          kit_version="$(sed -n 's/^GITLEAKS_VERSION="\(.*\)"$/\1/p' kit/install.sh)"
          kit_sha="$(sed -n 's/^GITLEAKS_SHA256_LINUX_X64="\(.*\)"$/\1/p' kit/install.sh)"
          if [ "$kit_version" != "$GITLEAKS_VERSION" ] || [ "$kit_sha" != "$GITLEAKS_SHA256_LINUX_X64" ]; then
            echo "FAIL: el pin de gitleaks divergio entre los dos emplazamientos" >&2
            echo "  .github/workflows/ci.yml -> ${GITLEAKS_VERSION} / ${GITLEAKS_SHA256_LINUX_X64}" >&2
            echo "  kit/install.sh           -> ${kit_version:-<no encontrado>} / ${kit_sha:-<no encontrado>}" >&2
            exit 1
          fi
          echo "OK: un solo pin de gitleaks ($GITLEAKS_VERSION) en ci.yml y en kit/install.sh"

      - name: Instalar gitleaks (version fijada + checksum)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_LINUX_X64}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      - name: test_guards.sh (Capa 1, por nombre de fichero)
        run: bash kit/test/test_guards.sh

      - name: test_guards_falsifiability.sh (la suite anterior es falsable)
        run: bash kit/test/test_guards_falsifiability.sh

      - name: test_secret_content_gitleaks.sh (Capa 2, por contenido)
        run: bash kit/test/test_secret_content_gitleaks.sh

      - name: test_scan_secrets.sh
        run: bash kit/test/test_scan_secrets.sh

      - name: test_install.sh (instala + idempotencia con backup)
        run: bash kit/test/test_install.sh

      - name: test_install_settings_merge.sh (statusLine y lo tuyo sobreviven a la fusion)
        run: bash kit/test/test_install_settings_merge.sh

      - name: test_doctor.sh
        run: bash kit/test/test_doctor.sh

      - name: test_install_platform_gate.sh (puerta de plataforma Linux/WSL2)
        run: bash kit/test/test_install_platform_gate.sh

      - name: test_install_gitleaks.sh (deteccion + degradacion sin gitleaks)
        run: bash kit/test/test_install_gitleaks.sh

      - name: "test_install_gitleaks_checksum.sh (mismatch de checksum: marca persistente, no rotura)"
        run: bash kit/test/test_install_gitleaks_checksum.sh

      - name: test_enable_secrets_layer2.sh (activacion opt-in por repo)
        run: bash kit/test/test_enable_secrets_layer2.sh

      - name: test_gitattributes.sh (sin CRLF en scripts/hooks versionados)
        run: bash kit/test/test_gitattributes.sh

      - name: test_exec_modes.sh (hooks commiteados como 100755, no solo en el filesystem)
        run: bash kit/test/test_exec_modes.sh

      - name: test_optional_hook.sh (dep ausente = no-op; exit 2 se propaga)
        run: bash kit/test/test_optional_hook.sh

      - name: "test_clean_install_resilience.sh (maquina pelada: no falla Y sigue bloqueando)"
        run: bash kit/test/test_clean_install_resilience.sh

      - name: test_doctor_base_url.sh (un proxy enrutado y muerto es FAIL)
        run: bash kit/test/test_doctor_base_url.sh

      - name: test_with_headroom.sh (solo cablea despues de comprobar /readyz)
        run: bash kit/test/test_with_headroom.sh

      - name: "test_headroom_guardrails.sh (modo cache, sin --budget ni --log-messages, una sola fuente de enrutado)"
        run: bash kit/test/test_headroom_guardrails.sh

      - name: test_metrics.sh (scripts/metrics.py sobre transcripts sinteticos)
        run: bash kit/test/test_metrics.sh

      - name: test_autonomy
        run: bash kit/test/test_autonomy.sh
      - name: test_detect_oracle
        run: bash kit/test/test_detect_oracle.sh
      - name: test_auto_spec
        run: bash kit/test/test_auto_spec.sh
      - name: test_harness_structure.sh (presupuesto de complejidad, oraculos, secretos, timeouts de mcharness)
        run: bash kit/test/test_harness_structure.sh

      - name: "test_install_diff_first.sh (CLAUDE_HOME repo git con remoto: diff-first, nunca escribe sin --apply)"
        run: bash kit/test/test_install_diff_first.sh

      - name: "test_uninstall.sh (restaura el backup mas reciente: interno o ZIP, dry-run por defecto)"
        run: bash kit/test/test_uninstall.sh

      # Estas dos corrian en `make test` pero NO en CI, y nada lo declaraba: un PR que
      # rompiera una cifra del README pasaba en verde. Son el sensor anti-mentira.
      - name: "test_doc_claims.sh (toda cifra que la doc afirma sobre el repo tiene sensor)"
        run: bash kit/test/test_doc_claims.sh

      - name: "test_permisos_efectivos.sh (ninguna regla Write() inerte ni consentimiento prefirmado)"
        run: bash kit/test/test_permisos_efectivos.sh

      - name: "test_evals.sh (sensor offline del eval set; sin almacen declara skip, nunca ok)"
        run: bash kit/test/test_evals.sh

  smoke-install-nonroot:
    name: Smoke test — install.sh en Debian limpio, usuario no root
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    # Dentro de un `container:`, Actions ejecuta cada `run:` con `sh -e {0}`
    # sin importar el shell por defecto del runner (a diferencia de un job
    # sin container, que ya usa bash). El `sh` de debian:12-slim es dash, que
    # no soporta `set -o pipefail` -> "Illegal option -o pipefail" en el
    # primer step. debian:12-slim SI trae bash instalado de fabrica (esta
    # imagen no es la variante "distroless"), asi que forzar bash aqui no
    # depende de la instalacion de bash del propio primer step.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependencias del sistema
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends bash git jq python3 ca-certificates sudo
          rm -rf /var/lib/apt/lists/*

      - name: Crear usuario no root
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash ciuser
          chown -R ciuser:ciuser "$GITHUB_WORKSPACE"

      - name: install.sh como usuario no root (1a pasada)
        run: su - ciuser -c "cd '$GITHUB_WORKSPACE' && bash kit/install.sh"

      - name: Post-condiciones tras la 1a instalacion
        run: |
          su - ciuser -c "cd '$GITHUB_WORKSPACE' && bash .github/scripts/assert-install.sh /home/ciuser/.claude"

      - name: doctor.sh como usuario no root
        run: su - ciuser -c "cd '$GITHUB_WORKSPACE' && CLAUDE_HOME=/home/ciuser/.claude bash kit/doctor.sh"

      - name: Huella de ficheros tras la 1a pasada (para comparar idempotencia)
        run: |
          su - ciuser -c "find /home/ciuser/.claude -type f -not -path '*/backups/*' -exec sha256sum {} +" \
            | sort -k2 > /tmp/install-pass1.sha256

      - name: install.sh de nuevo, sin tocar nada (2a pasada, idempotencia)
        run: su - ciuser -c "cd '$GITHUB_WORKSPACE' && bash kit/install.sh"

      - name: Post-condiciones tras la 2a instalacion
        run: |
          su - ciuser -c "cd '$GITHUB_WORKSPACE' && bash .github/scripts/assert-install.sh /home/ciuser/.claude"

      - name: Idempotencia -- mismo arbol de ficheros, sin backups nuevos
        run: |
          set -euo pipefail
          su - ciuser -c "find /home/ciuser/.claude -type f -not -path '*/backups/*' -exec sha256sum {} +" \
            | sort -k2 > /tmp/install-pass2.sha256
          diff /tmp/install-pass1.sha256 /tmp/install-pass2.sha256
          echo "OK: arbol de ficheros identico entre la 1a y la 2a pasada"
          nbackups=$(su - ciuser -c "find /home/ciuser/.claude/backups -mindepth 1 -maxdepth 1 2>/dev/null | wc -l")
          [ "$nbackups" -eq 0 ]
          echo "OK: la 2a pasada no genero backups (nada habia cambiado)"

      - name: doctor.sh sigue en verde tras la 2a pasada
        run: su - ciuser -c "cd '$GITHUB_WORKSPACE' && CLAUDE_HOME=/home/ciuser/.claude bash kit/doctor.sh"
