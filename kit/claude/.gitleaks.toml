# .gitleaks.toml — config de gitleaks para la capa 2 (hooks/git/pre-commit).
#
# Cierra un hueco de gitleaks con su config por defecto: la regla
# generic-api-key exige entropia >= 3.5, asi que contraseñas tipo diccionario
# (DB_PASSWORD=hunter2superSecret, entropia ~3.26) pasan sin detectar. Subir
# el umbral global reintroduce falsos positivos (PASSWORD= bloqueando en
# ficheros de prosa/código reales que solo mencionan la palabra).
#
# La solucion es una regla propia SIN umbral de entropia, acotada por
# extension de fichero de config (path) en vez de por contenido: medida sobre
# los ficheros trackeados de un repo real, la misma regex sin acotar por path
# dio 18 falsos positivos (prosa, JS, markdown que mencionan
# PASSWORD=/TOKEN= como ejemplo); acotada a extensiones de config dio 0.
#
# .json queda deliberadamente FUERA de esa lista de extensiones (a diferencia
# de yaml/toml/ini/properties/conf/cfg, que son casi siempre config propia).
# La medicion de 0 falsos positivos solo es valida para este repo, pequeño y
# centrado en documentacion: en un proyecto Node real, .json cubre
# package-lock.json, tsconfig.json, specs de OpenAPI, etc., y la regex
# (PASSWORD|...|TOKEN|...)\s*[:=]\s*(\S{8,}) puede caer sobre un
# "token": "algun-valor-interno" completamente inocuo. Si algun dia hace
# falta cubrir JSON de verdad, el remedio ya documentado (kit/docs/05-security.md)
# es el fingerprint en .gitleaksignore, no ampliar este path de nuevo sin
# repetir la medicion sobre un repo representativo.
#
# useDefault = true: extiende (no reemplaza) las reglas por defecto de
# gitleaks -- las claves de AWS y las genericas de alta entropia se siguen
# detectando igual que antes de que este fichero existiera.
#
# Para Anthropic eso NO bastaba, y el comentario anterior lo afirmaba de mas.
# Medido con gitleaks 8.30.1 sobre repos desechables (claves sinteticas): la
# regla por defecto anthropic-api-key solo dispara con la forma exacta
# sk-ant-<tipo>-<93 chars>AA. Con la misma clave alargada a 105 chars, el
# fichero se COMITEA sin bloqueo en .yaml, .txt y .md; lo unico que salvaba el
# caso .yaml del test era el prefijo de asignacion (ANTHROPIC_API_KEY=...),
# que lo caza dict-password-config-file, no una regla de Anthropic. Es decir:
# la deteccion dependia de la entropia y la forma del valor, no del prefijo
# sk-ant-, y fuera de las extensiones de config no quedaba nada.
#
# De ahi anthropic-api-key-prefix, abajo: SIN acotar por path (el prefijo
# sk-ant- es inequivoco, no necesita el contexto de un fichero de config) y
# sin umbral de entropia ni longitud fija, para que cubra tambien claves
# truncadas, de admin o de un formato futuro.
#
# Nota de invocacion: este fichero se pasa con -c explicito en
# hooks/git/pre-commit, no se depende de la autodeteccion
# "(target path)/.gitleaks.toml" de gitleaks -- ver ese hook para el detalle
# de por que se prefiere explicito.

title = "claude-config-secrets"

[extend]
useDefault = true

[[rules]]
id = "dict-password-config-file"
description = "Asignacion PASSWORD/SECRET/TOKEN/API_KEY con valor tipo diccionario en un fichero de configuracion (sin exigir alta entropia)"
regex = '''(?i)(?:PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY)\s*[:=]\s*(\S{8,})'''
path = '''\.(ya?ml|toml|ini|properties|conf|cfg)$'''

  [rules.allowlist]
  regexes = [
    '''(?i)^(changeme|example|placeholder|dummy|fake|test)''',
    '''^\$\{''',
    '''^<.*>$''',
  ]

[[rules]]
id = "anthropic-api-key-prefix"
description = "Clave de API de Anthropic por prefijo sk-ant-, en cualquier tipo de fichero (la regla por defecto solo cubre la forma <93 chars>AA)"
regex = '''sk-ant-[a-zA-Z0-9\-_]{20,}'''
keywords = ["sk-ant-"]

# --- Excepcion: las huellas que mch sella en su journal -----------------------
# `mch task start` sella una huella SHA-256 por cada fichero declarado como
# `- sensor:` y la escribe en .agents/journal.jsonl con la forma
#   "kit/test/test_scan_secrets.sh": "<64 hex>"
# La regla POR DEFECTO generic-api-key se arma con la palabra clave que aporta el
# NOMBRE del sensor ("secret", "token", "key") y da el hash por clave. Medido en
# este repo: cada tarea con sensor enrojecia el gate y bloqueaba su propio commit.
#
# Aqui NO vale el remedio que 05-security.md documenta para los falsos positivos
# (fingerprint en .gitleaksignore): el journal es append-only y crece, asi que
# cada tarea nueva pediria una entrada nueva, para siempre.
#
# Por que la excepcion es por FORMA DEL SECRETO y no por ruta, que seria lo
# obvio: medido con gitleaks 8.30.1, en un allowlist GLOBAL un `paths` que
# coincide exime el fichero ENTERO antes de mirar el contenido, y
# `matchCondition = "AND"` no lo impide -- un allowlist con `paths` del journal y
# una regex imposible (^zzzimposible$) seguia dejando pasar un token ghp_ dentro
# del journal. O sea: la version "acotada" que uno escribiria de primeras es la
# mas ancha de las dos. Acotando por el secreto, un token real pegado en el
# journal -- que es donde un agente pega salida de comandos -- sigue cayendo.
#
# Lo que esto cede, dicho sin adornos: una credencial que sea exactamente 64 hex
# en minuscula deja de dispararle a generic-api-key en TODO el repo. Los formatos
# con prefijo (ghp_, sk-ant-, xox., AKIA) tienen regla propia y siguen cayendo;
# el hueco que queda -- API_KEY=<64 hex> en un fichero de config -- lo cubre
# kit/scan-secrets.sh, que corre en `make test`.
#
# test_secret_content_gitleaks.sh prueba las dos direcciones: la huella pasa y
# un token real en el mismo journal bloquea.
[[allowlists]]
description = "huellas SHA-256 (64 hex) selladas por mch como `- sensor:`; ver comentario de arriba"
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']
