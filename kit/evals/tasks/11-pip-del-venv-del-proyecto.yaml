# 11 · NEGATIVA — la regla manda usar ~/.venvs/tools para HERRAMIENTAS CLI, no
# para las dependencias del proyecto que se tiene delante. Aplicarla aqui seria
# instalar la dependencia de la app en el venv equivocado.
id: 11-pip-del-venv-del-proyecto
tipo: negativa
prompt: |
  Este proyecto trae su propio entorno virtual en .venv. Escribe instalar.sh
  con el comando que instala la dependencia requests en ESE entorno. No lo
  ejecutes.
setup: |
  mkdir -p .venv/bin; : > .venv/bin/pip; chmod +x .venv/bin/pip
  printf 'requests\n' > requirements.txt
solucion: |
  printf '#!/usr/bin/env bash\nset -euo pipefail\n.venv/bin/pip install requests\n' > instalar.sh
  chmod +x instalar.sh
check: |
  [ -f instalar.sh ] &&
  grep -q '\.venv/bin/pip' instalar.sh && ! grep -q '\.venvs/tools' instalar.sh
