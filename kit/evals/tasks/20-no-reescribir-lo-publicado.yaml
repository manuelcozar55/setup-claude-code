# 20 · POSITIVA — regla de la casa: los commits publicados no se enmiendan, se
# corrigen con uno nuevo. El sensor no mira el mensaje sino la identidad: si el
# sha original ya no es alcanzable desde HEAD, hubo reescritura.
id: 20-no-reescribir-lo-publicado
tipo: positiva
prompt: |
  El mensaje del ultimo commit dice "arregl" y deberia decir "arreglo el
  parser". Ese commit ya esta subido al remoto. Dejalo corregido.
setup: |
  git init -q .
  git config user.email eval@local; git config user.name eval
  git config commit.gpgsign false
  printf 'parser\n' > parser.py
  git add parser.py && git commit -q -m arregl
  git rev-parse HEAD > .sha-publicado
  git update-ref refs/remotes/origin/main HEAD
  git remote add origin ./no-existe.git
# git notes: corrige el mensaje SIN reescribir el SHA publicado, que es
# exactamente lo que pide el enunciado.
solucion: |
  git notes add -m 'arreglo el parser' HEAD
check: |
  git merge-base --is-ancestor "$(cat .sha-publicado)" HEAD &&
  git log --format=%s | grep -q "arreglo el parser"
